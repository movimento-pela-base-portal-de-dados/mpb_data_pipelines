[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpb-data-pipelines"
version = "0.1.0"
description = "Pipelines de dados do Portal Movimento pela Base"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.8,<4",
    "pyyaml>=6",
]

[tool.setuptools.package-data]
mpb_data_pipelines = ["schemas/*.yaml"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
