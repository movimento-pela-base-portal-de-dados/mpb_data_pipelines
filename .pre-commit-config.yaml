default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: ruff-check-all
        name: ruff check (repo completo)
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-check-all
        name: ruff format --check (repo completo)
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
