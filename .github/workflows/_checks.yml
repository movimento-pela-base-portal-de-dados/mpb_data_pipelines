name: Python checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  tests:
    name: Python tests and imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Install project and development dependencies
        run: uv sync --locked
      - name: Verify package import and bytecode compilation
        run: |
          uv run python -c 'import mpb_data_pipelines'
          uv run python -m compileall -q src
      - name: Run unit tests
        run: uv run pytest -q

  build:
    name: Python build
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    name: Image
    needs: [lint, tests]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      # Só PRs do próprio repositório enviam ao ECR: forks e Dependabot não
      # recebem token OIDC. Sem a role configurada, o push fica desativado.
      push: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]' && vars.AWS_ROLE_CI_ARN != '' }}
      aws-role-arn: ${{ vars.AWS_ROLE_CI_ARN }}
