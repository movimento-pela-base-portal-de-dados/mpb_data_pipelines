name: Pull request

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: Source branch policy
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only staging can open a pull request into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "::error::Pull requests into main must come from staging (got '$HEAD_REF')."
            exit 1
          fi

  checks:
    # id-token: write é repassado ao job Image (OIDC para o ECR).
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_checks.yml
